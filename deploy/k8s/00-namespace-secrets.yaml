apiVersion: v1
kind: Namespace
metadata: {name: tenderai}
---
# Create the real secret out of band, e.g.:
#   kubectl -n tenderai create secret generic tenderai-secrets \
#     --from-literal=OWS_TOKEN=... --from-literal=POSTGRES_PASSWORD=... --from-literal=AGENT_DB_PASSWORD=...
# This template only documents the expected keys; never commit real values.
apiVersion: v1
kind: Secret
metadata: {name: tenderai-secrets, namespace: tenderai}
type: Opaque
stringData:
  OWS_TOKEN: "change-me"
  POSTGRES_PASSWORD: "change-me"
  AGENT_DB_PASSWORD: "change-me"
---
apiVersion: v1
kind: ConfigMap
metadata: {name: tenderai-config, namespace: tenderai}
data:
  LLM_BASE_URL: http://ollama:11434
  LLM_MODEL: qwen3.5:9b
