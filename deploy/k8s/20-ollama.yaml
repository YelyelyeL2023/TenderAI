apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: ollama-models, namespace: tenderai}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 30Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ollama, namespace: tenderai}
spec:
  replicas: 1
  selector: {matchLabels: {app: ollama}}
  template:
    metadata: {labels: {app: ollama}}
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.40.3
          env: [{name: OLLAMA_KEEP_ALIVE, value: "30m"}]
          ports: [{containerPort: 11434}]
          resources: {limits: {nvidia.com/gpu: 1, memory: 16Gi}}
          volumeMounts: [{name: models, mountPath: /root/.ollama}]
          # pull the model once: kubectl -n tenderai exec deploy/ollama -- ollama pull qwen3.5:9b
      volumes: [{name: models, persistentVolumeClaim: {claimName: ollama-models}}]
---
apiVersion: v1
kind: Service
metadata: {name: ollama, namespace: tenderai}
spec: {selector: {app: ollama}, ports: [{port: 11434}]}
